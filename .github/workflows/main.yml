name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build-jvm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test and build JAR
        run: |
          ./mvnw -Penv-test clean test -DexcludedGroups=docker -Dapi.version=1.44
          ./mvnw -Penv-prod package -DskipTests

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports-jar
          path: ilivalidator-web-service-server/target/surefire-reports/

      - name: Test locally built Docker image
        run: |
          docker image inspect --format '{{.Id}}' sogis/ilivalidator-web-service:latest
          ./mvnw test -Dgroups=docker -Dapi.version=1.44

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports-docker
          path: ilivalidator-web-service-server/target/surefire-reports/

      - uses: docker/setup-qemu-action@v4
        if: github.event_name == 'pull_request'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4
        if: github.event_name == 'pull_request'

      - name: Build both image platforms
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: ilivalidator-web-service-server
          file: ilivalidator-web-service-server/Dockerfile.jvm
          pull: true
          push: false

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: server-jar
          path: ilivalidator-web-service-server/target/ilivalidator-web-service-server-*.jar
          if-no-files-found: error

  publish:
    needs: build-jvm
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: sogis/ilivalidator-web-service
      VERSION: '3.0'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: server-jar
          path: ilivalidator-web-service-server/target

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish both image platforms
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@v7
        with:
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache
          platforms: linux/amd64,linux/arm64
          context: ilivalidator-web-service-server
          file: ilivalidator-web-service-server/Dockerfile.jvm
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}.${{ github.run_number }}
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:3
            ghcr.io/${{ env.IMAGE }}:latest
            ghcr.io/${{ env.IMAGE }}:${{ env.VERSION }}.${{ github.run_number }}
            ghcr.io/${{ env.IMAGE }}:${{ env.VERSION }}
            ghcr.io/${{ env.IMAGE }}:3
          labels: |
            commit=${{ github.sha }}
