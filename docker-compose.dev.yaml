# Docker Compose Setup für Development
#
# Dieses Setup baut das lokale Image von Source und startet Frontend + Worker
#
# Verwendung:
#   Build:    docker-compose -f docker-compose.dev.yaml build
#   Start:    docker-compose -f docker-compose.dev.yaml up -d
#   Scale:    docker-compose -f docker-compose.dev.yaml up -d --scale worker=5
#   Stop:     docker-compose -f docker-compose.dev.yaml down
#   Rebuild:  docker-compose -f docker-compose.dev.yaml up -d --build
#   Clean:    docker-compose -f docker-compose.dev.yaml down -v


services:
  # Frontend - REST API, Dashboard, Metrics
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ilivalidator-web-service:dev
    container_name: ilivalidator-frontend-dev
    restart: unless-stopped
    environment:
      TZ: Europe/Zurich
      LOG_LEVEL_APPLICATION: DEBUG
      JOBRUNR_SERVER_ENABLED: "false"
      REST_API_ENABLED: "true"
      JOBRUNR_DASHBOARD_ENABLED: "true"
      JOBRUNR_DASHBOARD_USER: admin
      JOBRUNR_DASHBOARD_PWD: admin
      CLEANER_ENABLED: "true"
      TOMCAT_THREADS_MAX: 20
      TOMCAT_ACCEPT_COUNT: 100
      TOMCAT_MAX_CONNECTIONS: 500
      HIKARI_MAX_POOL_SIZE: 10
      ILIDIRS: "https://geo.so.ch/models;https://models.interlis.ch;https://models.geo.admin.ch"
      MAX_FILE_SIZE: 200
      CONNECT_TIMEOUT: 5000
      READ_TIMEOUT: 5000
    ports:
      - "8080:8080"
      - "8000:8000"
    volumes:
      - work-data:/work
      # Optional: Mount test data
      # - ./test-data:/test-data:ro
    networks:
      - ilivalidator-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Worker - Background Job Processing
  worker:
    image: ilivalidator-web-service:dev
    restart: unless-stopped
    environment:
      TZ: Europe/Zurich
      LOG_LEVEL_APPLICATION: DEBUG
      JOBRUNR_SERVER_ENABLED: "true"
      JOBRUNR_POLL_INTERVAL: 5
      JOBRUNR_WORKER_COUNT: 1
      REST_API_ENABLED: "false"
      JOBRUNR_DASHBOARD_ENABLED: "false"
      CLEANER_ENABLED: "false"
      ILIDIRS: "https://geo.so.ch/models;https://models.interlis.ch;https://models.geo.admin.ch"
      CONNECT_TIMEOUT: 5000
      READ_TIMEOUT: 5000
    volumes:
      - work-data:/work
    networks:
      - ilivalidator-net
    depends_on:
      - frontend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  work-data:
    driver: local

networks:
  ilivalidator-net:
    driver: bridge
