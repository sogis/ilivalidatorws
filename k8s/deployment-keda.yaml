# Kubernetes Deployment mit KEDA Scale-to-Zero
#
# Dieses Manifest deployed Frontend + Worker MIT KEDA Autoscaling
# Worker können auf 0 skaliert werden wenn keine Jobs vorhanden sind
#
# Voraussetzungen:
# - KEDA installiert: helm install keda kedacore/keda --namespace keda --create-namespace
#
# Deploy mit: kubectl apply -f k8s/deployment-keda.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: ilivalidator
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ilivalidator-work-pvc
  namespace: ilivalidator
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Optional: StorageClass angeben
  # storageClassName: nfs-client
---
# ConfigMap für gemeinsame Konfiguration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ilivalidator-config
  namespace: ilivalidator
data:
  TZ: "Europe/Zurich"
  LOG_LEVEL_APPLICATION: "DEBUG"
  ILIDIRS: "https://geo.so.ch/models;https://models.interlis.ch;https://models.geo.admin.ch"
  MAX_FILE_SIZE: "200"
  CONNECT_TIMEOUT: "5000"
  READ_TIMEOUT: "5000"
---
# Frontend Deployment - REST API, Dashboard, Prometheus Metrics
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilivalidator-frontend
  namespace: ilivalidator
  labels:
    app: ilivalidator
    component: frontend
    version: v3.0.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ilivalidator
      component: frontend
  template:
    metadata:
      labels:
        app: ilivalidator
        component: frontend
        version: v3.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: ilivalidator
        image: docker.io/library/ilivalidator-web-service:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: dashboard
          containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: ilivalidator-config
        env:
        # Frontend führt KEINE Background Jobs aus
        - name: JOBRUNR_SERVER_ENABLED
          value: "false"
        # Frontend ist für Cleanup und Config zuständig
        - name: CLEANER_ENABLED
          value: "true"
        - name: REST_API_ENABLED
          value: "true"
        # Dashboard nur im Frontend
        - name: JOBRUNR_DASHBOARD_ENABLED
          value: "true"
        - name: JOBRUNR_DASHBOARD_USER
          value: "admin"
        - name: JOBRUNR_DASHBOARD_PWD
          value: "admin"
        # Tomcat Threading
        - name: TOMCAT_THREADS_MAX
          value: "20"
        - name: TOMCAT_ACCEPT_COUNT
          value: "100"
        - name: TOMCAT_MAX_CONNECTIONS
          value: "500"
        # Database Connection Pool
        - name: HIKARI_MAX_POOL_SIZE
          value: "10"
        volumeMounts:
        - name: work-volume
          mountPath: /work
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: work-volume
        persistentVolumeClaim:
          claimName: ilivalidator-work-pvc
---
# Worker Deployment - Background Job Processing (KEDA managed)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilivalidator-worker
  namespace: ilivalidator
  labels:
    app: ilivalidator
    component: worker
    version: v3.0.0
spec:
  # WICHTIG: replicas wird von KEDA überschrieben
  # Startwert ist 0 für Scale-to-Zero
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ilivalidator
      component: worker
  template:
    metadata:
      labels:
        app: ilivalidator
        component: worker
        version: v3.0.0
    spec:
      containers:
      - name: ilivalidator
        image: docker.io/library/ilivalidator-web-service:local
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: ilivalidator-config
        env:
        # Worker führt NUR Background Jobs aus
        - name: JOBRUNR_SERVER_ENABLED
          value: "true"
        - name: JOBRUNR_POLL_INTERVAL
          value: "5"
        - name: JOBRUNR_WORKER_COUNT
          value: "1"
        # Worker braucht kein REST API
        - name: REST_API_ENABLED
          value: "false"
        # Worker braucht kein Dashboard
        - name: JOBRUNR_DASHBOARD_ENABLED
          value: "false"
        # Worker macht kein Cleanup (nur Frontend)
        - name: CLEANER_ENABLED
          value: "false"
        volumeMounts:
        - name: work-volume
          mountPath: /work
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: work-volume
        persistentVolumeClaim:
          claimName: ilivalidator-work-pvc
---
# Frontend Service (von außen erreichbar)
apiVersion: v1
kind: Service
metadata:
  name: ilivalidator-frontend
  namespace: ilivalidator
  labels:
    app: ilivalidator
    component: frontend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: NodePort
  selector:
    app: ilivalidator
    component: frontend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
  - name: dashboard
    port: 8000
    targetPort: 8000
    nodePort: 30800
    protocol: TCP
---
# ============================================================================
# KEDA ScaledObject - Scale-to-Zero basierend auf jobrunr_pending_jobs
# ============================================================================
#
# ANFORDERUNGEN:
# - Innerhalb 5 Sekunden einen neuen Pod hochfahren
# - Bei 2 Pending Jobs gleichzeitig 2 Pods hochfahren
# - Scale-to-Zero: Bei 0 Jobs → 0 Worker nach Cooldown
#
# KONFIGURATION:
# - pollingInterval: 5s - KEDA prüft Prometheus alle 5 Sekunden
# - threshold: 1 - Pro 1 Pending Job wird 1 Worker gestartet
# - activationThreshold: 1 - Scale-up startet ab >= 1 Pending Job
# - scaleUp.value: 2 - Bis zu 2 Pods können innerhalb 5s hinzugefügt werden
# - stabilizationWindowSeconds: 0 - Sofortiges Scale-up ohne Verzögerung
#
# VERHALTEN:
# - 0 Pending Jobs → Scale-down zu 0 Pods nach 5 Min Cooldown
# - 1 Pending Job  → 1 Pod wird innerhalb 5s gestartet
# - 2 Pending Jobs → 2 Pods werden gleichzeitig innerhalb 5s gestartet
#
# WICHTIGE KEDA SETUP NOTIZEN:
# - KEDA v2.18.3 hat einen Bug mit der ScaledJob CRD (Annotations zu groß)
# - Die ScaledJob CRD fehlt nach Standard-Installation, KEDA Operator crasht (CrashLoopBackOff)
# - Fehler: "no matches for kind ScaledJob in version keda.sh/v1alpha1"
# - Lösung: ScaledJob CRD mit server-side apply installieren (umgeht Annotations-Limit)
# - Befehl: curl -sL https://raw.githubusercontent.com/kedacore/keda/v2.18.3/config/crd/bases/keda.sh_scaledjobs.yaml | kubectl apply --server-side=true -f -
# - Nach Installation KEDA Operator Pod neu starten: kubectl delete pod -n keda -l app.kubernetes.io/name=keda-operator
#
# ============================================================================
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ilivalidator-worker-scaler
  namespace: ilivalidator
spec:
  scaleTargetRef:
    name: ilivalidator-worker

  # Scale to Zero Configuration
  minReplicaCount: 0  # Bei 0 Jobs → 0 Worker (Scale-to-Zero aktiv)
  maxReplicaCount: 2  # Maximum 2 Worker

  # Timing Configuration
  pollingInterval: 5  # Alle 5s Metrics prüfen (schnelle Reaktion für 5s Anforderung)
  cooldownPeriod: 300  # 5 Min warten bevor scale-down zu 0

  # Scaling Behavior - Optimiert für schnelles Scale-up
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300  # 5 Min stabilisieren vor Scale-down
          policies:
          - type: Percent
            value: 50  # Max 50% Reduktion pro Minute
            periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0  # Sofort hochskalieren (keine Verzögerung)
          policies:
          - type: Pods
            value: 2  # Max 2 Pods innerhalb 5s hinzufügen (erfüllt 2-Jobs-Anforderung)
            periodSeconds: 5
          selectPolicy: Max  # Schnellste Policy gewinnt

  triggers:
  # Prometheus Trigger - fragt Prometheus Server ab
  - type: prometheus
    metadata:
      # Prometheus Server (scrappt Frontend Metriken über jobrunr_pending_jobs)
      serverAddress: http://prometheus.ilivalidator.svc.cluster.local:9090
      # PromQL Query - Anzahl Pending Jobs
      query: "jobrunr_pending_jobs"
      # Threshold: Pro X Jobs → 1 Worker
      threshold: "1"  # 1 Worker pro 1 Pending Job
      # activationThreshold: Aktiviere KEDA Scale-from-Zero wenn Metrik > diesem Wert
      # "0" bedeutet: Scale-to-Zero aktiv, aber minReplicas bleibt bei 1 (KEIN echtes Scale-to-Zero)
      # Für echtes Scale-to-Zero muss dieser Wert < kleinste erwartete Metrik sein
      activationThreshold: "0"
