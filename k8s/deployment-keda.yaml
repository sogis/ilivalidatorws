# Kubernetes Deployment mit KEDA Scale-to-Zero
#
# Dieses Manifest deployed Frontend + Worker MIT KEDA Autoscaling
# Worker können auf 0 skaliert werden wenn keine Jobs vorhanden sind
#
# Voraussetzungen:
# - KEDA installiert: helm install keda kedacore/keda --namespace keda --create-namespace
#
# Deploy mit: kubectl apply -f k8s/deployment-keda.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: ilivalidator
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ilivalidator-work-pvc
  namespace: ilivalidator
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Optional: StorageClass angeben
  # storageClassName: nfs-client
---
# ConfigMap für gemeinsame Konfiguration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ilivalidator-config
  namespace: ilivalidator
data:
  TZ: "Europe/Zurich"
  LOG_LEVEL_APPLICATION: "DEBUG"
  ILIDIRS: "https://geo.so.ch/models;https://models.interlis.ch;https://models.geo.admin.ch"
  MAX_FILE_SIZE: "200"
  CONNECT_TIMEOUT: "5000"
  READ_TIMEOUT: "5000"
---
# Frontend Deployment - REST API, Dashboard, Prometheus Metrics
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilivalidator-frontend
  namespace: ilivalidator
  labels:
    app: ilivalidator
    component: frontend
    version: v3.0.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ilivalidator
      component: frontend
  template:
    metadata:
      labels:
        app: ilivalidator
        component: frontend
        version: v3.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: ilivalidator
        image: docker.io/library/ilivalidator-web-service:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: dashboard
          containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: ilivalidator-config
        env:
        # Frontend führt KEINE Background Jobs aus
        - name: JOBRUNR_SERVER_ENABLED
          value: "false"
        # Frontend ist für Cleanup und Config zuständig
        - name: CLEANER_ENABLED
          value: "true"
        - name: REST_API_ENABLED
          value: "true"
        # Dashboard nur im Frontend
        - name: JOBRUNR_DASHBOARD_ENABLED
          value: "true"
        - name: JOBRUNR_DASHBOARD_USER
          value: "admin"
        - name: JOBRUNR_DASHBOARD_PWD
          value: "admin"
        # Tomcat Threading
        - name: TOMCAT_THREADS_MAX
          value: "20"
        - name: TOMCAT_ACCEPT_COUNT
          value: "100"
        - name: TOMCAT_MAX_CONNECTIONS
          value: "500"
        # Database Connection Pool
        - name: HIKARI_MAX_POOL_SIZE
          value: "10"
        volumeMounts:
        - name: work-volume
          mountPath: /work
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: work-volume
        persistentVolumeClaim:
          claimName: ilivalidator-work-pvc
---
# Worker Deployment - Background Job Processing (KEDA managed)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ilivalidator-worker
  namespace: ilivalidator
  labels:
    app: ilivalidator
    component: worker
    version: v3.0.0
spec:
  # WICHTIG: replicas wird von KEDA überschrieben
  # Startwert ist 0 für Scale-to-Zero
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ilivalidator
      component: worker
  template:
    metadata:
      labels:
        app: ilivalidator
        component: worker
        version: v3.0.0
    spec:
      containers:
      - name: ilivalidator
        image: docker.io/library/ilivalidator-web-service:local
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: ilivalidator-config
        env:
        # Worker führt NUR Background Jobs aus
        - name: JOBRUNR_SERVER_ENABLED
          value: "true"
        - name: JOBRUNR_POLL_INTERVAL
          value: "5"
        - name: JOBRUNR_WORKER_COUNT
          value: "1"
        # Worker braucht kein REST API
        - name: REST_API_ENABLED
          value: "false"
        # Worker braucht kein Dashboard
        - name: JOBRUNR_DASHBOARD_ENABLED
          value: "false"
        # Worker macht kein Cleanup (nur Frontend)
        - name: CLEANER_ENABLED
          value: "false"
        volumeMounts:
        - name: work-volume
          mountPath: /work
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: work-volume
        persistentVolumeClaim:
          claimName: ilivalidator-work-pvc
---
# Frontend Service (von außen erreichbar)
apiVersion: v1
kind: Service
metadata:
  name: ilivalidator-frontend
  namespace: ilivalidator
  labels:
    app: ilivalidator
    component: frontend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: NodePort
  selector:
    app: ilivalidator
    component: frontend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
  - name: dashboard
    port: 8000
    targetPort: 8000
    nodePort: 30800
    protocol: TCP
---
# KEDA ScaledObject - Scale-to-Zero basierend auf jobrunr_pending_jobs
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ilivalidator-worker-scaler
  namespace: ilivalidator
spec:
  scaleTargetRef:
    name: ilivalidator-worker

  # Scale to Zero Configuration
  minReplicaCount: 0  # Bei 0 Jobs → 0 Worker
  maxReplicaCount: 2  # Maximum 2 Worker

  # Timing Configuration
  pollingInterval: 5  # Alle 5s Metrics prüfen (schnellere Reaktion)
  cooldownPeriod: 300  # 5 Min warten bevor scale-down

  # Scaling Behavior
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300  # 5 Min stabilisieren
          policies:
          - type: Percent
            value: 50  # Max 50% Reduktion pro Minute
            periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0  # Sofort hochskalieren
          policies:
          - type: Percent
            value: 100  # Max 100% Erhöhung
            periodSeconds: 15
          - type: Pods
            value: 1  # Oder max 4 Pods auf einmal
            periodSeconds: 15
          selectPolicy: Max  # Schnellste Policy gewinnt

  triggers:
  # Prometheus Trigger - fragt Prometheus Server ab
  - type: prometheus
    metadata:
      # Prometheus Server (scrappt Frontend Metriken)
      serverAddress: http://prometheus.ilivalidator.svc.cluster.local:9090
      # PromQL Query
      query: |
        jobrunr_pending_jobs
      # Threshold: Pro X Jobs → 1 Worker
      threshold: "1"  # 1 Worker pro 1 Jobs
      # Bei 0 Jobs → scale to zero
      activationThreshold: "0"
