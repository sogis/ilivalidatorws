# Docker Compose Setup für ilivalidator-web-service
#
# Dieses Setup ermöglicht lokales Testen mit Frontend + mehreren Workers
#
# Verwendung:
#   Start:    docker-compose up -d
#   Scale:    docker-compose up -d --scale worker=5
#   Stop:     docker-compose down
#   Logs:     docker-compose logs -f


services:
  # Frontend - REST API, Dashboard, Metrics
  frontend:
    image: sogis/ilivalidator-web-service:3
    container_name: ilivalidator-frontend
    restart: unless-stopped
    environment:
      # Timezone
      TZ: Europe/Zurich

      # Logging
      LOG_LEVEL_APPLICATION: DEBUG

      # Frontend führt KEINE Background Jobs aus
      JOBRUNR_SERVER_ENABLED: "false"

      # REST API und Dashboard aktiviert
      REST_API_ENABLED: "true"
      JOBRUNR_DASHBOARD_ENABLED: "true"
      JOBRUNR_DASHBOARD_USER: admin
      JOBRUNR_DASHBOARD_PWD: admin

      # Cleanup aktiviert (nur im Frontend)
      CLEANER_ENABLED: "true"

      # Tomcat Settings
      TOMCAT_THREADS_MAX: 20
      TOMCAT_ACCEPT_COUNT: 100
      TOMCAT_MAX_CONNECTIONS: 500

      # Database Connection Pool
      HIKARI_MAX_POOL_SIZE: 10

      # INTERLIS Repositories
      ILIDIRS: "https://geo.so.ch/models;https://models.interlis.ch;https://models.geo.admin.ch"

      # File Upload Limits
      MAX_FILE_SIZE: 200

      # Timeouts
      CONNECT_TIMEOUT: 5000
      READ_TIMEOUT: 5000

    ports:
      # REST API und Web UI
      - "8080:8080"
      # Jobrunr Dashboard
      - "8000:8000"
    volumes:
      # Shared Volume für Job Queue DB und Upload Files
      - work-data:/work
    networks:
      - ilivalidator-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Worker - Background Job Processing
  # Kann mit --scale worker=N skaliert werden
  worker:
    image: sogis/ilivalidator-web-service:3
    restart: unless-stopped
    environment:
      # Timezone
      TZ: Europe/Zurich

      # Logging
      LOG_LEVEL_APPLICATION: DEBUG

      # Worker führt NUR Background Jobs aus
      JOBRUNR_SERVER_ENABLED: "true"
      JOBRUNR_POLL_INTERVAL: 5
      JOBRUNR_WORKER_COUNT: 1

      # REST API und Dashboard deaktiviert
      REST_API_ENABLED: "false"
      JOBRUNR_DASHBOARD_ENABLED: "false"

      # Cleanup deaktiviert (nur Frontend macht das)
      CLEANER_ENABLED: "false"

      # INTERLIS Repositories
      ILIDIRS: "https://geo.so.ch/models;https://models.interlis.ch;https://models.geo.admin.ch"

      # Timeouts
      CONNECT_TIMEOUT: 5000
      READ_TIMEOUT: 5000

    volumes:
      # Shared Volume für Job Queue DB und Upload Files
      - work-data:/work
    networks:
      - ilivalidator-net
    depends_on:
      - frontend
    # Replicas werden mit --scale gesetzt
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  work-data:
    driver: local

networks:
  ilivalidator-net:
    driver: bridge
